backend:
  name: github
  repo: pjoseph91/almaart-website
  branch: main
  auth_endpoint: /api/auth

local_backend: true
media_folder: public/images
public_folder: /images

collections:
  - name: pages
    label: 페이지
    folder: src/pages
    extension: astro
    format: frontmatter
    create: false
    files:
      - name: index
        label: 홈페이지
        file: src/pages/index.astro
        fields:
          - name: title
            label: 페이지 제목
            widget: string
          - name: hero_title
            label: 히어로 제목
            widget: text
          - name: hero_subtitle
            label: 히어로 설명
            widget: text

      - name: about
        label: 소개 페이지
        file: src/pages/about.astro
        fields:
          - name: title
            label: 페이지 제목
            widget: string
          - name: subtitle
            label: 페이지 부제목
            widget: text

      - name: spaces
        label: 공간 페이지
        file: src/pages/spaces.astro
        fields:
          - name: title
            label: 페이지 제목
            widget: string

      - name: programs
        label: 프로그램 페이지
        file: src/pages/programs.astro
        fields:
          - name: title
            label: 페이지 제목
            widget: string

      - name: contact
        label: 오시는 길 페이지
        file: src/pages/contact.astro
        fields:
          - name: title
            label: 페이지 제목
            widget: string
          - name: address
            label: 주소
            widget: text
          - name: phone
            label: 전화번호
            widget: string
          - name: email
            label: 이메일
            widget: string

      - name: reservations
        label: 예약·신청 페이지
        file: src/pages/reservations.astro
        fields:
          - name: title
            label: 페이지 제목
            widget: string

      - name: support
        label: 후원 페이지
        file: src/pages/support.astro
        fields:
          - name: title
            label: 페이지 제목
            widget: string
